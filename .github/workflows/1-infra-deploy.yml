name: 1 - infra deploy

on:
  push:
    branches: [develop]
    paths:
      - 'infrastructure/**'
      - '!infrastructure/modules/lambda/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.6.6'
  TF_STATE_BUCKET: qleam-terraform-state
  TF_STATE_LOCK_TABLE: qleam-terraform-state-lock

jobs:
  # ============================================================
  # Terraform Plan — show what will change
  # ============================================================
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ────────────────────────────────────────────────────────────────────────
      # Bootstrap: Ensure S3 bucket and DynamoDB lock table exist
      # These are required before Terraform can initialize
      # ────────────────────────────────────────────────────────────────────────
      - name: Bootstrap Terraform State Resources
        run: |
          echo "🔧 Bootstrapping Terraform state resources..."
          
          # 1. Create S3 state bucket if it doesn't exist
          echo "📦 Checking S3 state bucket..."
          if ! aws s3api head-bucket --bucket ${{ env.TF_STATE_BUCKET }} 2>/dev/null; then
            echo "  Creating S3 bucket: ${{ env.TF_STATE_BUCKET }}"
            aws s3api create-bucket \
              --bucket ${{ env.TF_STATE_BUCKET }} \
              --region ${{ env.AWS_REGION }} \
              --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}
            
            # Enable versioning
            aws s3api put-bucket-versioning \
              --bucket ${{ env.TF_STATE_BUCKET }} \
              --versioning-configuration Status=Enabled
            
            # Enable encryption
            aws s3api put-bucket-encryption \
              --bucket ${{ env.TF_STATE_BUCKET }} \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            
            # Block public access
            aws s3api put-public-access-block \
              --bucket ${{ env.TF_STATE_BUCKET }} \
              --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            
            echo "  ✅ S3 bucket created and configured"
          else
            echo "  ✅ S3 bucket already exists"
          fi
          
          # 2. Create DynamoDB lock table if it doesn't exist
          echo "🔒 Checking DynamoDB lock table..."
          if ! aws dynamodb describe-table --table-name ${{ env.TF_STATE_LOCK_TABLE }} 2>/dev/null; then
            echo "  Creating DynamoDB table: ${{ env.TF_STATE_LOCK_TABLE }}"
            aws dynamodb create-table \
              --table-name ${{ env.TF_STATE_LOCK_TABLE }} \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --tags Key=Project,Value=qleam Key=Purpose,Value=terraform-state-lock
            echo "  ✅ DynamoDB lock table created"
            
            # Wait for table to be active
            echo "  ⏳ Waiting for table to become active..."
            aws dynamodb wait table-exists --table-name ${{ env.TF_STATE_LOCK_TABLE }}
          else
            echo "  ✅ DynamoDB lock table already exists"
          fi
          
          echo ""
          echo "══════════════════════════════════════════════════════"
          echo "✅ Bootstrap complete - Terraform state resources ready"
          echo "   S3 Bucket: ${{ env.TF_STATE_BUCKET }}"
          echo "   DynamoDB Table: ${{ env.TF_STATE_LOCK_TABLE }}"
          echo "══════════════════════════════════════════════════════"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          cd infrastructure/environments/dev
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ env.TF_STATE_LOCK_TABLE }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        run: |
          cd infrastructure/environments/dev
          terraform validate

      - name: Terraform Plan
        run: |
          cd infrastructure/environments/dev
          terraform plan -var-file=terraform.tfvars -no-color 2>&1 | tee plan_output.txt
          echo ""
          echo "══════════════════════════════════════════════════════"
          echo "  Review the plan above, then approve the"
          echo "  'apply' job in GitHub Actions to deploy."
          echo "══════════════════════════════════════════════════════"

      - name: Upload plan output to S3
        run: |
          echo "📤 Uploading Terraform plan to S3..."
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          S3_PATH="s3://${{ env.TF_STATE_BUCKET }}/dev-plans/${TIMESTAMP}-plan_output.txt"
          aws s3 cp infrastructure/environments/dev/plan_output.txt "$S3_PATH"
          echo ""
          echo "══════════════════════════════════════════════════════"
          echo "✅ Plan uploaded to: $S3_PATH"
          echo "══════════════════════════════════════════════════════"

  # ============================================================
  # Terraform Apply — requires manual approval via
  #         GitHub Environment "dev" protection rule
  # ============================================================
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    environment: dev   # ← triggers manual approval gate

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          cd infrastructure/environments/dev
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ env.TF_STATE_LOCK_TABLE }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      # ────────────────────────────────────────────────────────────────────────
      # Phase 1: Create ECR repositories first (Lambda needs images)
      # ────────────────────────────────────────────────────────────────────────
      - name: Terraform Apply - ECR Repositories
        run: |
          cd infrastructure/environments/dev
          echo "📦 Phase 1: Creating ECR repositories..."
          terraform apply -auto-approve -var-file=terraform.tfvars \
            -target=module.ecr 2>&1 || true

      # ────────────────────────────────────────────────────────────────────────
      # Phase 2: Push placeholder images to ECR
      # Lambda requires images to exist before function creation
      # ────────────────────────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push placeholder Lambda images (first deploy only)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "📦 Phase 2: Checking which Lambda functions need placeholder images..."

          # List of Lambda function names (matching ECR repo names, underscores)
          LAMBDA_FUNCTIONS="feature_extraction cluster_engine reinforcement_engine insight_generator feedback_processor api_handler nlp_processor developmental_tracker concept_decoder speech_analyzer"

          PUSHED_ANY=false

          for FUNC in $LAMBDA_FUNCTIONS; do
            REPO_NAME="qleam-dev-${FUNC}"
            # Lambda function names use hyphens, ECR repo names use underscores
            LAMBDA_NAME="qleam-dev-${FUNC//_/-}"

            # Only push placeholder if Lambda function does not exist yet
            if aws lambda get-function --function-name "$LAMBDA_NAME" 2>/dev/null; then
              echo "  ✅ $LAMBDA_NAME already deployed — skipping placeholder push"
              continue
            fi

            echo "  → $LAMBDA_NAME not found, pushing placeholder to $REPO_NAME..."

            # Pull base image once
            if [ "$PUSHED_ANY" = "false" ]; then
              docker pull public.ecr.aws/lambda/python:3.11
              PUSHED_ANY=true
            fi

            mkdir -p /tmp/placeholder_$FUNC
            printf 'def lambda_handler(event, context):\n    return {"statusCode": 200, "body": "Placeholder - run lambda-deploy workflow"}\n' > /tmp/placeholder_$FUNC/handler.py
            printf 'FROM public.ecr.aws/lambda/python:3.11\nCOPY handler.py /var/task/\nCMD ["handler.lambda_handler"]\n' > /tmp/placeholder_$FUNC/Dockerfile

            docker build -t "$ECR_REGISTRY/$REPO_NAME:latest" /tmp/placeholder_$FUNC
            docker push "$ECR_REGISTRY/$REPO_NAME:latest"
            echo "  ✅ Placeholder pushed to $REPO_NAME"
          done

          echo ""
          echo "══════════════════════════════════════════════════════"
          echo "✅ Phase 2 complete"
          echo "══════════════════════════════════════════════════════"

      # ────────────────────────────────────────────────────────────────────────
      # Phase 3: Create all remaining resources (including Lambda functions)
      # ────────────────────────────────────────────────────────────────────────
      - name: Terraform Apply - All Resources
        run: |
          cd infrastructure/environments/dev
          terraform apply -auto-approve -var-file=terraform.tfvars

      - name: Show outputs
        run: |
          cd infrastructure/environments/dev
          echo "──────────────────────────────────────"
          echo "✅ DEV infrastructure deployed"
          terraform output 2>/dev/null || true
          echo "──────────────────────────────────────"
          
          # Extract frontend URL for easy access
          FRONTEND_URL=$(terraform output -raw frontend_url 2>/dev/null || echo "")
          if [ -n "$FRONTEND_URL" ] && [ "$FRONTEND_URL" != "None" ]; then
            echo ""
            echo "══════════════════════════════════════════════════════"
            echo "🌐 Frontend URL: $FRONTEND_URL"
            echo "   Click to open → $FRONTEND_URL"
            echo "══════════════════════════════════════════════════════"
          fi
