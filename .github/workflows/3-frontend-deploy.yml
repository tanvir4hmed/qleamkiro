
name: 3 - frontend deploy

on:
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '18'
  TF_STATE_BUCKET: qleam-terraform-state
  TF_STATE_LOCK_TABLE: qleam-terraform-state-lock

jobs:
  # ===========================================================================
  # Job 1: Build Frontend
  # ===========================================================================
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.6'
          terraform_wrapper: false

      - name: Fetch Terraform outputs for frontend build
        id: terraform-outputs
        run: |
          cd infrastructure/environments/dev
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ env.TF_STATE_LOCK_TABLE }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -input=false
          
          # Fetch outputs
          COGNITO_USER_POOL_ID=$(terraform output -raw cognito_user_pool_id 2>/dev/null || echo "")
          COGNITO_CLIENT_ID=$(terraform output -raw cognito_client_id 2>/dev/null || echo "")
          API_ENDPOINT=$(terraform output -raw api_endpoint 2>/dev/null || echo "")
          
          # Validate outputs
          if [ -z "$COGNITO_USER_POOL_ID" ] || [ "$COGNITO_USER_POOL_ID" = "null" ]; then
            echo "❌ Error: COGNITO_USER_POOL_ID is not set or is null"
            exit 1
          fi
          
          if [ -z "$COGNITO_CLIENT_ID" ] || [ "$COGNITO_CLIENT_ID" = "null" ]; then
            echo "❌ Error: COGNITO_CLIENT_ID is not set or is null"
            exit 1
          fi
          
          if [ -z "$API_ENDPOINT" ] || [ "$API_ENDPOINT" = "null" ]; then
            echo "❌ Error: API_ENDPOINT is not set or is null"
            exit 1
          fi
          
          echo "✅ Terraform outputs fetched successfully:"
          echo "   COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}"
          echo "   COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}"
          echo "   API_ENDPOINT: ${API_ENDPOINT}"
          
          # Set outputs for use in build step
          echo "cognito_user_pool_id=$COGNITO_USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "cognito_client_id=$COGNITO_CLIENT_ID" >> $GITHUB_OUTPUT
          echo "api_endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Configure npm for CI environment
        run: |
          cd frontend
          npm config set registry https://registry.npmjs.org/
          npm config set strict-ssl true
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 10000
          npm config set fetch-retry-maxtimeout 60000

      - name: Install dependencies with fallback
        run: |
          cd frontend
          # Try npm ci first, fallback to npm install if it fails
          if ! npm ci --verbose; then
            echo "npm ci failed, trying npm install..."
            npm install --verbose
          fi

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          REACT_APP_ENVIRONMENT: dev
          REACT_APP_COGNITO_USER_POOL_ID: ${{ steps.terraform-outputs.outputs.cognito_user_pool_id }}
          REACT_APP_COGNITO_CLIENT_ID: ${{ steps.terraform-outputs.outputs.cognito_client_id }}
          REACT_APP_API_URL: ${{ steps.terraform-outputs.outputs.api_endpoint }}

      - name: Upload frontend build to S3
        run: |
          echo "📤 Uploading frontend build to S3..."
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          S3_PATH="s3://${{ env.TF_STATE_BUCKET }}/frontend-builds/${TIMESTAMP}"
          aws s3 sync frontend/build/ "$S3_PATH/"
          echo "build_s3_path=$S3_PATH" >> $GITHUB_OUTPUT
          echo ""
          echo "══════════════════════════════════════════════════════"
          echo "✅ Frontend build uploaded to: $S3_PATH"
          echo "══════════════════════════════════════════════════════"
        id: upload-build

  # ===========================================================================
  # Job 2: Deploy Frontend to S3
  # ===========================================================================
  deploy:
    name: Deploy Frontend to DEV
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.6'
          terraform_wrapper: false

      - name: Fetch frontend URL from Terraform outputs
        id: tf-outputs
        run: |
          cd infrastructure/environments/dev
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ env.TF_STATE_LOCK_TABLE }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -input=false
          
          # Fetch frontend URL from Terraform outputs
          FRONTEND_URL=$(terraform output -raw frontend_url 2>/dev/null || echo "")
          CF_DIST_ID=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || echo "")
          
          echo "frontend_url=$FRONTEND_URL" >> $GITHUB_OUTPUT
          echo "cf_distribution_id=$CF_DIST_ID" >> $GITHUB_OUTPUT
          echo "✅ Frontend URL: $FRONTEND_URL"

      - name: Download latest frontend build from S3
        run: |
          echo "📥 Downloading latest frontend build from S3..."
          # Get the latest build folder
          LATEST_BUILD=$(aws s3 ls s3://${{ env.TF_STATE_BUCKET }}/frontend-builds/ | sort -r | head -1 | awk '{print $2}' | tr -d '/')
          if [ -z "$LATEST_BUILD" ]; then
            echo "❌ Error: No frontend build found in S3"
            exit 1
          fi
          S3_PATH="s3://${{ env.TF_STATE_BUCKET }}/frontend-builds/${LATEST_BUILD}/"
          echo "   Latest build: $LATEST_BUILD"
          mkdir -p frontend/build
          aws s3 sync "$S3_PATH" frontend/build/
          echo "✅ Frontend build downloaded successfully"

      - name: Deploy frontend to S3 (DEV)
        run: |
          FRONTEND_BUCKET="qleam-dev-frontend"
          aws s3 sync frontend/build/ s3://${FRONTEND_BUCKET}/ --delete
          echo "✅ Frontend deployed to s3://${FRONTEND_BUCKET}"

      - name: Invalidate CloudFront cache (DEV)
        id: cloudfront
        run: |
          CF_ID="${{ steps.tf-outputs.outputs.cf_distribution_id }}"
          
          if [ -n "$CF_ID" ] && [ "$CF_ID" != "None" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$CF_ID" \
              --paths "/*" > /dev/null
            echo "✅ CloudFront cache invalidated: $CF_ID"
          else
            echo "ℹ️  No CloudFront distribution ID found — skipping invalidation."
          fi

      - name: Deployment summary
        run: |
          FRONTEND_URL="${{ steps.tf-outputs.outputs.frontend_url }}"
          
          echo "══════════════════════════════════════════════════════"
          echo "✅  Frontend deployed successfully!"
          echo ""
          echo "   Branch  : ${{ github.ref_name }}"
          echo "   Commit  : ${{ github.sha }}"
          if [ -n "$FRONTEND_URL" ] && [ "$FRONTEND_URL" != "None" ]; then
            echo ""
            echo "   🌐 App URL : $FRONTEND_URL"
            echo ""
            echo "   Click to open → $FRONTEND_URL"
          else
            echo ""
            echo "   ℹ️  Frontend URL not found in Terraform outputs."
            echo "   Check AWS Console → CloudFront for the domain."
          fi
          echo "══════════════════════════════════════════════════════"
