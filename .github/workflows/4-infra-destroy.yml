name: 4 - infra destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm full teardown of DEV environment'
        required: true

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.6.6'
  TF_STATE_BUCKET: qleam-terraform-state
  TF_STATE_LOCK_TABLE: qleam-terraform-state-lock
  PROJECT: qleam
  ENV: dev

jobs:
  destroy:
    name: Destroy DEV Infrastructure & Application
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy'
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ────────────────────────────────────────────────────────────────────────
      # Bootstrap: Ensure state resources exist before Terraform init
      # ────────────────────────────────────────────────────────────────────────
      - name: Bootstrap Terraform State Resources
        run: |
          echo "🔧 Ensuring Terraform state resources exist..."
          
          if ! aws dynamodb describe-table --table-name ${{ env.TF_STATE_LOCK_TABLE }} 2>/dev/null; then
            echo "  Creating DynamoDB lock table..."
            aws dynamodb create-table \
              --table-name ${{ env.TF_STATE_LOCK_TABLE }} \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --tags Key=Project,Value=qleam Key=Purpose,Value=terraform-state-lock
            aws dynamodb wait table-exists --table-name ${{ env.TF_STATE_LOCK_TABLE }}
            echo "  ✅ DynamoDB lock table created"
          else
            echo "  ✅ DynamoDB lock table exists"
          fi

      # ════════════════════════════════════════════════════════════════════════
      # PHASE 1: Stop all running processes and delete compute resources
      # ════════════════════════════════════════════════════════════════════════
      - name: PHASE 1 - Stop all running processes
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "PHASE 1: Stopping all running processes and compute resources"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""

          # Stop all Step Functions executions
          echo "🛑 Stopping Step Functions executions..."
          SFNS=$(aws stepfunctions list-state-machines \
            --query "stateMachines[?starts_with(name, '${{ env.PROJECT }}-${{ env.ENV }}')].stateMachineArn" \
            --output text 2>/dev/null || echo "")
          
          for SFN_ARN in $SFNS; do
            EXECUTIONS=$(aws stepfunctions list-executions \
              --state-machine-arn "$SFN_ARN" \
              --query "executions[?status=='RUNNING'].executionArn" \
              --output text 2>/dev/null || echo "")
            for EXEC_ARN in $EXECUTIONS; do
              echo "  Stopping execution: $EXEC_ARN"
              aws stepfunctions stop-execution --execution-arn "$EXEC_ARN" 2>/dev/null || true
            done
          done
          echo "  ✅ Step Functions executions stopped"

      # ════════════════════════════════════════════════════════════════════════
      # PHASE 2: Delete Lambda functions (releases ENIs for VPC deletion)
      # ════════════════════════════════════════════════════════════════════════
      - name: PHASE 2 - Delete Lambda functions
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "PHASE 2: Deleting Lambda functions (releases ENIs)"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""

          FUNCTIONS=$(aws lambda list-functions \
            --query "Functions[?starts_with(FunctionName, '${{ env.PROJECT }}-${{ env.ENV }}')].FunctionName" \
            --output text 2>/dev/null || echo "")

          for FN in $FUNCTIONS; do
            echo "  → Processing Lambda function: $FN"
            
            # First, remove from VPC to release ENIs
            echo "    Removing from VPC..."
            aws lambda update-function-configuration \
              --function-name "$FN" \
              --vpc-config SubnetIds=,SecurityGroupIds= 2>/dev/null || true
            
            # Wait for ENI release
            echo "    Waiting for ENI release (30s)..."
            sleep 30
            
            # Delete function with retry
            for attempt in 1 2 3; do
              if aws lambda delete-function --function-name "$FN" 2>/dev/null; then
                echo "    ✅ Lambda $FN deleted"
                break
              else
                echo "    Attempt $attempt failed, waiting 10s..."
                sleep 10
              fi
            done
          done
          
          # Also delete Lambda layers
          echo ""
          echo "  Deleting Lambda layers..."
          LAYERS=$(aws lambda list-layers \
            --query "Layers[?starts_with(LayerName, '${{ env.PROJECT }}-${{ env.ENV }}')].LayerName" \
            --output text 2>/dev/null || echo "")

          for LAYER in $LAYERS; do
            VERSIONS=$(aws lambda list-layer-versions \
              --layer-name "$LAYER" \
              --query 'LayerVersions[].Version' \
              --output text 2>/dev/null || echo "")
            for VER in $VERSIONS; do
              aws lambda delete-layer-version --layer-name "$LAYER" --version-number "$VER" 2>/dev/null || true
            done
            echo "    ✅ Layer $LAYER deleted"
          done

      # ════════════════════════════════════════════════════════════════════════
      # PHASE 3: Delete API Gateway (depends on Lambda)
      # ════════════════════════════════════════════════════════════════════════
      - name: PHASE 3 - Delete API Gateway
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "PHASE 3: Deleting API Gateway"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""

          APIS=$(aws apigatewayv2 get-apis \
            --query "Items[?starts_with(Name, '${{ env.PROJECT }}-${{ env.ENV }}')].ApiId" \
            --output text 2>/dev/null || echo "")

          for API_ID in $APIS; do
            echo "  → Deleting API: $API_ID"
            aws apigatewayv2 delete-api --api-id "$API_ID" 2>/dev/null && \
              echo "    ✅ API $API_ID deleted" || \
              echo "    ⚠️  Could not delete API $API_ID"
          done

      # ════════════════════════════════════════════════════════════════════════
      # PHASE 4: Delete Step Functions
      # ════════════════════════════════════════════════════════════════════════
      - name: PHASE 4 - Delete Step Functions
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "PHASE 4: Deleting Step Functions"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""

          SFNS=$(aws stepfunctions list-state-machines \
            --query "stateMachines[?starts_with(name, '${{ env.PROJECT }}-${{ env.ENV }}')].stateMachineArn" \
            --output text 2>/dev/null || echo "")

          for SFN_ARN in $SFNS; do
            echo "  → Deleting state machine: $(basename $SFN_ARN)"
            aws stepfunctions delete-state-machine --state-machine-arn "$SFN_ARN" 2>/dev/null && \
              echo "    ✅ State machine deleted" || \
              echo "    ⚠️  Could not delete state machine"
          done

      # ════════════════════════════════════════════════════════════════════════
      # PHASE 5: Delete CloudFront (CRITICAL - must be disabled first)
      # ════════════════════════════════════════════════════════════════════════
      - name: PHASE 5 - Disable and Delete CloudFront
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "PHASE 5: Disabling and Deleting CloudFront Distributions"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""

          DIST_IDS=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Comment, '${{ env.PROJECT }}') && contains(Comment, '${{ env.ENV }}')].Id" \
            --output text 2>/dev/null || echo "")

          for DIST_ID in $DIST_IDS; do
            echo "  → Processing distribution: $DIST_ID"
            
            # Get current config
            ETAG=$(aws cloudfront get-distribution-config --id "$DIST_ID" --query 'ETag' --output text 2>/dev/null || echo "")
            if [ -z "$ETAG" ]; then
              echo "    ⚠️  Could not get distribution config, skipping"
              continue
            fi
            
            CONFIG=$(aws cloudfront get-distribution-config --id "$DIST_ID" --query 'DistributionConfig' --output json 2>/dev/null || echo "")
            if [ -z "$CONFIG" ]; then
              continue
            fi
            
            # Check if already disabled
            IS_ENABLED=$(echo "$CONFIG" | jq -r '.Enabled')
            
            if [ "$IS_ENABLED" = "true" ]; then
              echo "    Disabling distribution..."
              DISABLED_CONFIG=$(echo "$CONFIG" | jq '.Enabled = false')
              
              aws cloudfront update-distribution \
                --id "$DIST_ID" \
                --distribution-config "$DISABLED_CONFIG" \
                --if-match "$ETAG" > /dev/null 2>&1
              
              # Wait for deployment with timeout
              echo "    Waiting for distribution to be disabled (this may take 10-15 minutes)..."
              for i in $(seq 1 30); do
                STATUS=$(aws cloudfront get-distribution --id "$DIST_ID" --query 'Distribution.Status' --output text 2>/dev/null || echo "")
                if [ "$STATUS" = "Deployed" ]; then
                  echo "    ✅ Distribution disabled"
                  break
                fi
                echo "    Status: $STATUS (attempt $i/30)..."
                sleep 30
              done
            else
              echo "    Distribution already disabled"
            fi
            
            # Now delete the distribution
            echo "    Deleting distribution..."
            ETAG=$(aws cloudfront get-distribution --id "$DIST_ID" --query 'ETag' --output text 2>/dev/null || echo "")
            aws cloudfront delete-distribution --id "$DIST_ID" --if-match "$ETAG" 2>/dev/null && \
              echo "    ✅ Distribution $DIST_ID deleted" || \
              echo "    ⚠️  Could not delete distribution"
          done
          
          # Delete CloudFront OACs
          echo ""
          echo "  Deleting CloudFront Origin Access Controls..."
          OACS=$(aws cloudfront list-origin-access-controls \
            --query "OriginAccessControlList.Items[?starts_with(Name, '${{ env.PROJECT }}-${{ env.ENV }}')].Id" \
            --output text 2>/dev/null || echo "")
          
          for OAC_ID in $OACS; do
            echo "    Deleting OAC: $OAC_ID"
            aws cloudfront delete-origin-access-control --id "$OAC_ID" 2>/dev/null && \
              echo "    ✅ OAC deleted" || \
              echo "    ⚠️  Could not delete OAC"
          done

      # ════════════════════════════════════════════════════════════════════════
      # PHASE 6: Empty and delete S3 buckets
      # ════════════════════════════════════════════════════════════════════════
      - name: PHASE 6 - Empty and Delete S3 Buckets
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "PHASE 6: Emptying and Deleting S3 Buckets"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""

          empty_bucket() {
            local BUCKET=$1
            echo "  → Emptying bucket: $BUCKET"
            
            # Delete all object versions
            echo "    Deleting object versions..."
            while true; do
              VERSIONS=$(aws s3api list-object-versions --bucket "$BUCKET" \
                --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' \
                --output json 2>/dev/null || echo '{"Objects":[]}')
              
              COUNT=$(echo "$VERSIONS" | jq '.Objects | length')
              if [ "$COUNT" -eq 0 ] || [ "$COUNT" = "null" ]; then
                break
              fi
              
              echo "$VERSIONS" | jq -c '.Objects' | while read -r batch; do
                aws s3api delete-objects --bucket "$BUCKET" --delete "{\"Objects\": $batch}" > /dev/null 2>&1 || true
              done
            done
            
            # Delete all delete markers
            echo "    Deleting delete markers..."
            while true; do
              MARKERS=$(aws s3api list-object-versions --bucket "$BUCKET" \
                --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' \
                --output json 2>/dev/null || echo '{"Objects":[]}')
              
              COUNT=$(echo "$MARKERS" | jq '.Objects | length')
              if [ "$COUNT" -eq 0 ] || [ "$COUNT" = "null" ]; then
                break
              fi
              
              echo "$MARKERS" | jq -c '.Objects' | while read -r batch; do
                aws s3api delete-objects --bucket "$BUCKET" --delete "{\"Objects\": $batch}" > /dev/null 2>&1 || true
              done
            done
            
            # Final cleanup with s3 rm
            echo "    Final cleanup..."
            aws s3 rm "s3://$BUCKET" --recursive 2>/dev/null || true
            
            echo "    ✅ Bucket emptied: $BUCKET"
          }

          BUCKETS=$(aws s3api list-buckets \
            --query "Buckets[?starts_with(Name, '${{ env.PROJECT }}-${{ env.ENV }}')].Name" \
            --output text 2>/dev/null || echo "")

          for BUCKET in $BUCKETS; do
            empty_bucket "$BUCKET"
            
            # Delete the bucket
            echo "    Deleting bucket..."
            aws s3api delete-bucket --bucket "$BUCKET" 2>/dev/null && \
              echo "    ✅ Bucket deleted: $BUCKET" || \
              echo "    ⚠️  Could not delete bucket: $BUCKET"
          done

      # ════════════════════════════════════════════════════════════════════════
      # PHASE 7: Delete Cognito resources
      # ════════════════════════════════════════════════════════════════════════
      - name: PHASE 7 - Delete Cognito Resources
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "PHASE 7: Deleting Cognito Resources"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""

          # Delete Identity Pools first
          echo "  Deleting Identity Pools..."
          IDENTITY_POOLS=$(aws cognito-identity list-identity-pools \
            --max-results 60 \
            --query "IdentityPools[?starts_with(IdentityPoolName, '${{ env.PROJECT }}-${{ env.ENV }}')].IdentityPoolId" \
            --output text 2>/dev/null || echo "")

          for POOL_ID in $IDENTITY_POOLS; do
            echo "    Deleting Identity Pool: $POOL_ID"
            aws cognito-identity delete-identity-pool --identity-pool-id "$POOL_ID" 2>/dev/null && \
              echo "    ✅ Identity Pool deleted" || \
              echo "    ⚠️  Could not delete Identity Pool"
          done

          # Delete User Pools
          echo "  Deleting User Pools..."
          POOLS=$(aws cognito-idp list-user-pools --max-results 60 \
            --query "UserPools[?starts_with(Name, '${{ env.PROJECT }}-${{ env.ENV }}')].Id" \
            --output text 2>/dev/null || echo "")

          for POOL_ID in $POOLS; do
            echo "    Processing User Pool: $POOL_ID"
            
            # Delete app clients first
            CLIENTS=$(aws cognito-idp list-user-pool-clients \
              --user-pool-id "$POOL_ID" \
              --query 'UserPoolClients[].ClientId' --output text 2>/dev/null || echo "")
            for CLIENT in $CLIENTS; do
              echo "      Deleting app client: $CLIENT"
              aws cognito-idp delete-user-pool-client --user-pool-id "$POOL_ID" --client-id "$CLIENT" 2>/dev/null || true
            done
            
            # Delete domain
            DOMAIN=$(aws cognito-idp describe-user-pool \
              --user-pool-id "$POOL_ID" \
              --query 'UserPool.Domain' --output text 2>/dev/null || echo "")
            if [ -n "$DOMAIN" ] && [ "$DOMAIN" != "None" ] && [ "$DOMAIN" != "null" ]; then
              echo "      Deleting domain: $DOMAIN"
              aws cognito-idp delete-user-pool-domain --user-pool-id "$POOL_ID" --domain "$DOMAIN" 2>/dev/null || true
              sleep 5
            fi
            
            # Delete the pool
            echo "      Deleting User Pool..."
            aws cognito-idp delete-user-pool --user-pool-id "$POOL_ID" 2>/dev/null && \
              echo "    ✅ User Pool deleted" || \
              echo "    ⚠️  Could not delete User Pool"
          done

      # ════════════════════════════════════════════════════════════════════════
      # PHASE 8: Delete DynamoDB tables
      # ════════════════════════════════════════════════════════════════════════
      - name: PHASE 8 - Delete DynamoDB Tables
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "PHASE 8: Deleting DynamoDB Tables"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""

          TABLES=$(aws dynamodb list-tables \
            --query "TableNames[?starts_with(@, '${{ env.PROJECT }}-${{ env.ENV }}')]" \
            --output text 2>/dev/null || echo "")

          for TABLE in $TABLES; do
            echo "  → Deleting table: $TABLE"
            aws dynamodb delete-table --table-name "$TABLE" 2>/dev/null && \
              echo "    ✅ Table deleted" || \
              echo "    ⚠️  Could not delete table"
          done

      # ════════════════════════════════════════════════════════════════════════
      # PHASE 9: Terraform Destroy
      # ════════════════════════════════════════════════════════════════════════
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          cd infrastructure/environments/dev
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ env.TF_STATE_LOCK_TABLE }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Remove lifecycle prevent_destroy overrides
        run: |
          find infrastructure/ -name "*.tf" -exec \
            sed -i 's/prevent_destroy\s*=\s*true/prevent_destroy = false/g' {} +
          echo "✅ prevent_destroy overrides removed."

      - name: PHASE 9 - Terraform Destroy
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "PHASE 9: Terraform Destroy"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          
          cd infrastructure/environments/dev
          terraform destroy -auto-approve -var-file=terraform.tfvars 2>&1 || true
          echo "✅ Terraform destroy completed"

      # ════════════════════════════════════════════════════════════════════════
      # PHASE 10: Force cleanup any remaining resources
      # ════════════════════════════════════════════════════════════════════════
      - name: PHASE 10 - Force Cleanup Remaining Resources
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "PHASE 10: Force Cleanup Remaining Resources"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""

          # Delete any remaining S3 buckets
          echo "🗑️  Checking for remaining S3 buckets..."
          BUCKETS=$(aws s3api list-buckets \
            --query "Buckets[?starts_with(Name, '${{ env.PROJECT }}-${{ env.ENV }}')].Name" \
            --output text 2>/dev/null || echo "")
          for BUCKET in $BUCKETS; do
            echo "  → Force deleting bucket: $BUCKET"
            aws s3 rm "s3://$BUCKET" --recursive 2>/dev/null || true
            aws s3api delete-bucket --bucket "$BUCKET" 2>/dev/null || true
          done

          # Delete remaining Lambda functions
          echo "🗑️  Checking for remaining Lambda functions..."
          FUNCTIONS=$(aws lambda list-functions \
            --query "Functions[?starts_with(FunctionName, '${{ env.PROJECT }}-${{ env.ENV }}')].FunctionName" \
            --output text 2>/dev/null || echo "")
          for FN in $FUNCTIONS; do
            echo "  → Deleting Lambda: $FN"
            aws lambda delete-function --function-name "$FN" 2>/dev/null || true
          done

          # Delete remaining CloudFront distributions
          echo "🗑️  Checking for remaining CloudFront distributions..."
          DIST_IDS=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Comment, '${{ env.PROJECT }}') && contains(Comment, '${{ env.ENV }}')].Id" \
            --output text 2>/dev/null || echo "")
          for DIST_ID in $DIST_IDS; do
            echo "  → Deleting CloudFront: $DIST_ID"
            ETAG=$(aws cloudfront get-distribution --id "$DIST_ID" --query 'ETag' --output text 2>/dev/null || echo "")
            [ -n "$ETAG" ] && aws cloudfront delete-distribution --id "$DIST_ID" --if-match "$ETAG" 2>/dev/null || true
          done

          # Delete remaining OACs
          echo "🗑️  Checking for remaining CloudFront OACs..."
          OACS=$(aws cloudfront list-origin-access-controls \
            --query "OriginAccessControlList.Items[?starts_with(Name, '${{ env.PROJECT }}-${{ env.ENV }}')].Id" \
            --output text 2>/dev/null || echo "")
          for OAC_ID in $OACS; do
            echo "  → Deleting OAC: $OAC_ID"
            aws cloudfront delete-origin-access-control --id "$OAC_ID" 2>/dev/null || true
          done

          # Delete remaining DynamoDB tables
          echo "🗑️  Checking for remaining DynamoDB tables..."
          TABLES=$(aws dynamodb list-tables \
            --query "TableNames[?starts_with(@, '${{ env.PROJECT }}-${{ env.ENV }}')]" \
            --output text 2>/dev/null || echo "")
          for TABLE in $TABLES; do
            echo "  → Deleting table: $TABLE"
            aws dynamodb delete-table --table-name "$TABLE" 2>/dev/null || true
          done

          # Delete remaining Cognito resources
          echo "🗑️  Checking for remaining Cognito User Pools..."
          POOLS=$(aws cognito-idp list-user-pools --max-results 60 \
            --query "UserPools[?starts_with(Name, '${{ env.PROJECT }}-${{ env.ENV }}')].Id" \
            --output text 2>/dev/null || echo "")
          for POOL_ID in $POOLS; do
            echo "  → Deleting User Pool: $POOL_ID"
            aws cognito-idp delete-user-pool --user-pool-id "$POOL_ID" 2>/dev/null || true
          done

          # Delete remaining Step Functions
          echo "🗑️  Checking for remaining Step Functions..."
          SFNS=$(aws stepfunctions list-state-machines \
            --query "stateMachines[?starts_with(name, '${{ env.PROJECT }}-${{ env.ENV }}')].stateMachineArn" \
            --output text 2>/dev/null || echo "")
          for SFN_ARN in $SFNS; do
            echo "  → Deleting state machine: $(basename $SFN_ARN)"
            aws stepfunctions delete-state-machine --state-machine-arn "$SFN_ARN" 2>/dev/null || true
          done

          # Delete remaining API Gateways
          echo "🗑️  Checking for remaining API Gateways..."
          APIS=$(aws apigatewayv2 get-apis \
            --query "Items[?starts_with(Name, '${{ env.PROJECT }}-${{ env.ENV }}')].ApiId" \
            --output text 2>/dev/null || echo "")
          for API_ID in $APIS; do
            echo "  → Deleting API: $API_ID"
            aws apigatewayv2 delete-api --api-id "$API_ID" 2>/dev/null || true
          done

          # Delete remaining CloudWatch Log Groups
          echo "🗑️  Deleting CloudWatch Log Groups..."
          LOG_GROUPS=$(aws logs describe-log-groups \
            --log-group-name-prefix "/aws/lambda/${{ env.PROJECT }}-${{ env.ENV }}" \
            --query 'logGroups[].logGroupName' --output text 2>/dev/null || echo "")
          for LG in $LOG_GROUPS; do
            echo "  → Deleting log group: $LG"
            aws logs delete-log-group --log-group-name "$LG" 2>/dev/null || true
          done
          
          # Also delete Step Functions log groups
          SFN_LOGS=$(aws logs describe-log-groups \
            --log-group-name-prefix "/aws/states/${{ env.PROJECT }}-${{ env.ENV }}" \
            --query 'logGroups[].logGroupName' --output text 2>/dev/null || echo "")
          for LG in $SFN_LOGS; do
            echo "  → Deleting log group: $LG"
            aws logs delete-log-group --log-group-name "$LG" 2>/dev/null || true
          done

          # Delete remaining ECR repositories
          echo "🗑️  Checking for remaining ECR repositories..."
          REPOS=$(aws ecr describe-repositories \
            --query "repositories[?starts_with(repositoryName, '${{ env.PROJECT }}-${{ env.ENV }}')].repositoryName" \
            --output text 2>/dev/null || echo "")
          for REPO in $REPOS; do
            echo "  → Deleting ECR repo: $REPO"
            aws ecr delete-repository --repository-name "$REPO" --force 2>/dev/null || true
          done

          # Delete remaining IAM roles
          echo "🗑️  Checking for remaining IAM roles..."
          ROLES=$(aws iam list-roles \
            --query "Roles[?starts_with(RoleName, '${{ env.PROJECT }}-${{ env.ENV }}')].RoleName" \
            --output text 2>/dev/null || echo "")
          for ROLE in $ROLES; do
            echo "  → Processing role: $ROLE"
            # Detach all policies
            POLICIES=$(aws iam list-attached-role-policies --role-name "$ROLE" --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null || echo "")
            for P in $POLICIES; do
              aws iam detach-role-policy --role-name "$ROLE" --policy-arn "$P" 2>/dev/null || true
            done
            # Delete inline policies
            INLINE=$(aws iam list-role-policies --role-name "$ROLE" --query 'PolicyNames[]' --output text 2>/dev/null || echo "")
            for IP in $INLINE; do
              aws iam delete-role-policy --role-name "$ROLE" --policy-name "$IP" 2>/dev/null || true
            done
            # Delete role
            aws iam delete-role --role-name "$ROLE" 2>/dev/null || true
          done

          # Delete remaining IAM policies
          echo "🗑️  Checking for remaining IAM policies..."
          POLICIES=$(aws iam list-policies --scope Local \
            --query "Policies[?starts_with(PolicyName, '${{ env.PROJECT }}-${{ env.ENV }}')].Arn" \
            --output text 2>/dev/null || echo "")
          for P_ARN in $POLICIES; do
            echo "  → Deleting policy: $(basename $P_ARN)"
            aws iam delete-policy --policy-arn "$P_ARN" 2>/dev/null || true
          done

          # Release any orphaned EIPs
          echo "🗑️  Releasing orphaned Elastic IPs..."
          EIPS=$(aws ec2 describe-addresses \
            --query 'Addresses[?AssociationId==`null`].AllocationId' \
            --output text 2>/dev/null || echo "")
          for EIP in $EIPS; do
            echo "  → Releasing EIP: $EIP"
            aws ec2 release-address --allocation-id "$EIP" 2>/dev/null || true
          done

          # Delete any orphaned ENIs
          echo "🗑️  Deleting orphaned Network Interfaces..."
          ENIS=$(aws ec2 describe-network-interfaces \
            --filters "Name=status,Values=available" "Name=description,Values=AWS Lambda*" \
            --query 'NetworkInterfaces[].NetworkInterfaceId' \
            --output text 2>/dev/null || echo "")
          for ENI in $ENIS; do
            echo "  → Deleting ENI: $ENI"
            aws ec2 delete-network-interface --network-interface-id "$ENI" 2>/dev/null || true
          done

          # Delete remaining VPCs
          echo "🗑️  Checking for remaining VPCs..."
          VPC_IDS=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Project,Values=${{ env.PROJECT }}" "Name=tag:Environment,Values=${{ env.ENV }}" \
            --query 'Vpcs[].VpcId' --output text 2>/dev/null || echo "")
          for VPC_ID in $VPC_IDS; do
            echo "  → Cleaning up VPC: $VPC_ID"
            
            # Delete network interfaces
            ENIS=$(aws ec2 describe-network-interfaces --filters "Name=vpc-id,Values=$VPC_ID" --query 'NetworkInterfaces[].NetworkInterfaceId' --output text 2>/dev/null || echo "")
            for ENI in $ENIS; do
              aws ec2 delete-network-interface --network-interface-id "$ENI" 2>/dev/null || true
            done
            
            # Delete subnets
            SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC_ID" --query 'Subnets[].SubnetId' --output text 2>/dev/null || echo "")
            for SUBNET in $SUBNETS; do
              aws ec2 delete-subnet --subnet-id "$SUBNET" 2>/dev/null || true
            done
            
            # Detach and delete IGWs
            IGWS=$(aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=$VPC_ID" --query 'InternetGateways[].InternetGatewayId' --output text 2>/dev/null || echo "")
            for IGW in $IGWS; do
              aws ec2 detach-internet-gateway --internet-gateway-id "$IGW" --vpc-id "$VPC_ID" 2>/dev/null || true
              aws ec2 delete-internet-gateway --internet-gateway-id "$IGW" 2>/dev/null || true
            done
            
            # Delete route tables
            RTS=$(aws ec2 describe-route-tables --filters "Name=vpc-id,Values=$VPC_ID" --query 'RouteTables[?Associations[?Main==`false`] || length(Associations)==`0`].RouteTableId' --output text 2>/dev/null || echo "")
            for RT in $RTS; do
              aws ec2 delete-route-table --route-table-id "$RT" 2>/dev/null || true
            done
            
            # Delete security groups
            SGS=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC_ID" --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text 2>/dev/null || echo "")
            for SG in $SGS; do
              aws ec2 delete-security-group --group-id "$SG" 2>/dev/null || true
            done
            
            # Delete NAT Gateways (wait for deletion)
            NATS=$(aws ec2 describe-nat-gateways --filter "Name=vpc-id,Values=$VPC_ID" "Name=state,Values=available" --query 'NatGateways[].NatGatewayId' --output text 2>/dev/null || echo "")
            for NAT in $NATS; do
              aws ec2 delete-nat-gateway --nat-gateway-id "$NAT" 2>/dev/null || true
            done
            
            # Wait for NAT gateways to be deleted
            if [ -n "$NATS" ]; then
              echo "    Waiting for NAT gateways to delete (60s)..."
              sleep 60
            fi
            
            # Finally delete the VPC
            aws ec2 delete-vpc --vpc-id "$VPC_ID" 2>/dev/null && \
              echo "    ✅ VPC deleted" || \
              echo "    ⚠️  Could not delete VPC"
          done

      # ────────────────────────────────────────────────────────────────────────
      # Final Summary
      # ────────────────────────────────────────────────────────────────────────
      - name: Final Summary
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "                    DESTROY COMPLETE"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "✅ All '${{ env.PROJECT }}-${{ env.ENV }}' resources have been removed."
          echo ""
          echo "ℹ️  PRESERVED (for future deployments):"
          echo "   • S3 State Bucket: ${{ env.TF_STATE_BUCKET }}"
          echo "   • DynamoDB Lock Table: ${{ env.TF_STATE_LOCK_TABLE }}"
          echo ""
          echo "   To manually delete state resources:"
          echo "   aws s3 rm s3://${{ env.TF_STATE_BUCKET }} --recursive"
          echo "   aws s3 rb s3://${{ env.TF_STATE_BUCKET }}"
          echo "   aws dynamodb delete-table --table-name ${{ env.TF_STATE_LOCK_TABLE }}"
          echo "═══════════════════════════════════════════════════════════════"