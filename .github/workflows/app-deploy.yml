name: app deploy

on:
  push:
    branches: [develop]
    paths:
      - 'lambdas/**'
      - 'shared/**'
      - 'frontend/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  TF_STATE_BUCKET: qleam-terraform-state
  TF_STATE_LOCK_TABLE: qleam-terraform-state-lock

jobs:
  # ===========================================================================
  # Job 1: Run Tests
  # ===========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: pip install pytest pytest-cov boto3 moto numpy

      - name: Run unit tests
        run: python -m pytest tests/ -v --cov=shared --cov=lambdas --cov-report=xml
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

  # ===========================================================================
  # Job 2: Build Lambda Packages
  # ===========================================================================
  build-lambdas:
    name: Build Lambda Packages
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build shared utils layer
        run: |
          mkdir -p lambdas/layers/shared_utils_pkg/python
          cp shared/*.py lambdas/layers/shared_utils_pkg/python/
          cd lambdas/layers/shared_utils_pkg
          zip -r ../shared_utils.zip python/
          echo "✅ Shared utils layer built"

      - name: Build audio processing layer
        run: |
          mkdir -p lambdas/layers/audio_processing_pkg/python
          # Use the official AWS Lambda Python 3.11 Docker image to ensure
          # Linux-compatible binaries (numpy, scipy, soundfile all have native
          # extensions that must match Lambda's runtime environment).
          # pip --only-binary approach silently skips packages without wheels
          # and produces an incomplete layer — Docker is the reliable fix.
          docker run --rm \
            -v "$(pwd)/lambdas/layers/audio_processing_pkg:/out" \
            public.ecr.aws/lambda/python:3.11 \
            pip install \
              numpy \
              scipy \
              librosa \
              soundfile \
              --target /out/python \
              --no-cache-dir \
              --quiet
          # Strip test dirs, __pycache__, and *.dist-info to reduce layer size
          find lambdas/layers/audio_processing_pkg/python \
            \( -type d -name "tests"      \
            -o -type d -name "test"       \
            -o -type d -name "__pycache__" \) \
            -exec rm -rf {} + 2>/dev/null || true
          find lambdas/layers/audio_processing_pkg/python \
            \( -name "*.pyc" -o -name "*.pyo" \) \
            -delete 2>/dev/null || true
          find lambdas/layers/audio_processing_pkg/python \
            -type d -name "*.dist-info" \
            -exec rm -rf {} + 2>/dev/null || true
          cd lambdas/layers/audio_processing_pkg
          zip -r ../audio_processing.zip python/ -q
          echo "Layer zip size: $(du -sh ../audio_processing.zip | cut -f1)"
          echo "✅ Audio processing layer built"

      - name: Build Lambda function packages
        run: |
          for lambda_dir in \
            lambdas/feature_extraction \
            lambdas/cluster_engine \
            lambdas/reinforcement_engine \
            lambdas/insight_generator \
            lambdas/feedback_processor \
            lambdas/api_handler; do
            lambda_name=$(basename $lambda_dir)
            echo "📦 Building $lambda_name..."
            mkdir -p $lambda_dir/dist
            cd $lambda_dir
            zip -r dist/${lambda_name}.zip handler.py
            cd ../..
          done
          echo "✅ All Lambda packages built"

      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: |
            lambdas/layers/shared_utils.zip
            lambdas/layers/audio_processing.zip
            lambdas/feature_extraction/dist/
            lambdas/cluster_engine/dist/
            lambdas/reinforcement_engine/dist/
            lambdas/insight_generator/dist/
            lambdas/feedback_processor/dist/
            lambdas/api_handler/dist/
          retention-days: 7

  # ===========================================================================
  # Job 3: Build Frontend
  # ===========================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.6'
          terraform_wrapper: false

      - name: Fetch Terraform outputs for frontend build
        id: terraform-outputs
        run: |
          cd infrastructure/environments/dev
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ env.TF_STATE_LOCK_TABLE }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -input=false
          
          # Fetch outputs
          COGNITO_USER_POOL_ID=$(terraform output -raw cognito_user_pool_id 2>/dev/null || echo "")
          COGNITO_CLIENT_ID=$(terraform output -raw cognito_client_id 2>/dev/null || echo "")
          API_ENDPOINT=$(terraform output -raw api_endpoint 2>/dev/null || echo "")
          
          # Validate outputs
          if [ -z "$COGNITO_USER_POOL_ID" ] || [ "$COGNITO_USER_POOL_ID" = "null" ]; then
            echo "❌ Error: COGNITO_USER_POOL_ID is not set or is null"
            exit 1
          fi
          
          if [ -z "$COGNITO_CLIENT_ID" ] || [ "$COGNITO_CLIENT_ID" = "null" ]; then
            echo "❌ Error: COGNITO_CLIENT_ID is not set or is null"
            exit 1
          fi
          
          if [ -z "$API_ENDPOINT" ] || [ "$API_ENDPOINT" = "null" ]; then
            echo "❌ Error: API_ENDPOINT is not set or is null"
            exit 1
          fi
          
          echo "✅ Terraform outputs fetched successfully:"
          echo "   COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}"
          echo "   COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}"
          echo "   API_ENDPOINT: ${API_ENDPOINT}"
          
          # Set outputs for use in build step
          echo "cognito_user_pool_id=$COGNITO_USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "cognito_client_id=$COGNITO_CLIENT_ID" >> $GITHUB_OUTPUT
          echo "api_endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No cache — package-lock.json is not committed to the repo

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          REACT_APP_ENVIRONMENT: dev
          REACT_APP_COGNITO_USER_POOL_ID: ${{ steps.terraform-outputs.outputs.cognito_user_pool_id }}
          REACT_APP_COGNITO_CLIENT_ID: ${{ steps.terraform-outputs.outputs.cognito_client_id }}
          REACT_APP_API_URL: ${{ steps.terraform-outputs.outputs.api_endpoint }}

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  # ===========================================================================
  # Job 4: Deploy Application to DEV
  # Deploys Lambda functions via Terraform and syncs frontend to S3
  # ===========================================================================
  deploy-dev:
    name: Deploy App to DEV
    runs-on: ubuntu-latest
    needs: [build-lambdas, build-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Download Lambda artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: lambdas/

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.6'
          terraform_wrapper: false

      - name: Upload audio layer to S3 (bypasses 70 MB direct-upload limit)
        run: |
          S3_KEY="lambda-layers/qleam-dev-audio-processing.zip"
          aws s3 cp lambdas/layers/audio_processing.zip \
            s3://${{ env.TF_STATE_BUCKET }}/${S3_KEY} \
            --no-progress
          echo "✅ Audio layer uploaded to s3://${{ env.TF_STATE_BUCKET }}/${S3_KEY}"

      - name: Create placeholder zips for remaining layers (filebase64sha256)
        run: |
          echo "placeholder" > /tmp/placeholder.py
          zip /tmp/placeholder.zip /tmp/placeholder.py
          mkdir -p lambdas/layers
          # shared_utils is small — keep direct upload; audio is now via S3
          [ -f lambdas/layers/shared_utils.zip ] || cp /tmp/placeholder.zip lambdas/layers/shared_utils.zip
          for fn in feature_extraction cluster_engine reinforcement_engine \
                    insight_generator feedback_processor api_handler; do
            mkdir -p lambdas/${fn}/dist
            [ -f lambdas/${fn}/dist/${fn}.zip ] || cp /tmp/placeholder.zip lambdas/${fn}/dist/${fn}.zip
          done

      - name: Terraform Init
        run: |
          cd infrastructure/environments/dev
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ env.TF_STATE_LOCK_TABLE }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Apply (Lambda updates only)
        run: |
          cd infrastructure/environments/dev
          terraform apply -auto-approve \
            -var-file=terraform.tfvars \
            -target=module.lambda

      - name: Deploy frontend to S3 (DEV)
        run: |
          FRONTEND_BUCKET="qleam-dev-frontend"
          aws s3 sync frontend/build/ s3://${FRONTEND_BUCKET}/ --delete
          echo "✅ Frontend deployed to s3://${FRONTEND_BUCKET}"

      - name: Invalidate CloudFront cache (DEV)
        id: cloudfront
        run: |
          CF_DOMAIN=""
          CF_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Origins.Items[0].DomainName,'qleam-dev-frontend')].Id" \
            --output text 2>/dev/null || echo "")

          if [ -z "$CF_ID" ] || [ "$CF_ID" = "None" ]; then
            CF_ID=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?contains(Comment,'dev')].Id" \
              --output text 2>/dev/null || echo "")
          fi

          if [ -n "$CF_ID" ] && [ "$CF_ID" != "None" ]; then
            CF_DOMAIN=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?Id=='${CF_ID}'].DomainName" \
              --output text 2>/dev/null || echo "")
            aws cloudfront create-invalidation \
              --distribution-id "$CF_ID" \
              --paths "/*" > /dev/null
            echo "✅ CloudFront cache invalidated: $CF_ID"
          else
            echo "ℹ️  No CloudFront distribution found — skipping invalidation."
          fi

          echo "cf_domain=$CF_DOMAIN" >> $GITHUB_OUTPUT
          echo "cf_id=$CF_ID"         >> $GITHUB_OUTPUT

      - name: Deployment summary
        run: |
          CF_DOMAIN="${{ steps.cloudfront.outputs.cf_domain }}"
          echo "══════════════════════════════════════════════════════"
          echo "✅  DEV application deployed successfully!"
          echo ""
          echo "   Branch  : ${{ github.ref_name }}"
          echo "   Commit  : ${{ github.sha }}"
          if [ -n "$CF_DOMAIN" ] && [ "$CF_DOMAIN" != "None" ]; then
            echo ""
            echo "   🌐 App URL : https://${CF_DOMAIN}"
            echo ""
            echo "   Open in browser → https://${CF_DOMAIN}"
          else
            echo ""
            echo "   ℹ️  CloudFront domain not found in this step."
            echo "   Check AWS Console → CloudFront for the domain."
          fi
          echo "══════════════════════════════════════════════════════"
