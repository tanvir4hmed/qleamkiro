name: app deploy

on:
  push:
    branches: [develop]
    paths:
      - 'lambdas/**'
      - 'shared/**'
      - 'frontend/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # ===========================================================================
  # Job 1: Run Tests
  # ===========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: pip install pytest pytest-cov boto3 moto numpy

      - name: Run unit tests
        run: python -m pytest tests/ -v --cov=shared --cov=lambdas --cov-report=xml
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

  # ===========================================================================
  # Job 2: Build Lambda Packages
  # ===========================================================================
  build-lambdas:
    name: Build Lambda Packages
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build shared utils layer
        run: |
          mkdir -p lambdas/layers/shared_utils_pkg/python
          cp shared/*.py lambdas/layers/shared_utils_pkg/python/
          cd lambdas/layers/shared_utils_pkg
          zip -r ../shared_utils.zip python/
          echo "✅ Shared utils layer built"

      - name: Build audio processing layer
        run: |
          mkdir -p lambdas/layers/audio_processing_pkg/python
          pip install librosa numpy scipy \
            --target lambdas/layers/audio_processing_pkg/python/ \
            --platform manylinux2014_x86_64 \
            --only-binary=:all: \
            --python-version 3.11
          cd lambdas/layers/audio_processing_pkg
          zip -r ../audio_processing.zip python/
          echo "✅ Audio processing layer built"

      - name: Build Lambda function packages
        run: |
          for lambda_dir in \
            lambdas/feature_extraction \
            lambdas/cluster_engine \
            lambdas/reinforcement_engine \
            lambdas/insight_generator \
            lambdas/feedback_processor \
            lambdas/api_handler; do
            lambda_name=$(basename $lambda_dir)
            echo "📦 Building $lambda_name..."
            mkdir -p $lambda_dir/dist
            cd $lambda_dir
            zip -r dist/${lambda_name}.zip handler.py
            cd ../..
          done
          echo "✅ All Lambda packages built"

      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: |
            lambdas/layers/shared_utils.zip
            lambdas/layers/audio_processing.zip
            lambdas/feature_extraction/dist/
            lambdas/cluster_engine/dist/
            lambdas/reinforcement_engine/dist/
            lambdas/insight_generator/dist/
            lambdas/feedback_processor/dist/
            lambdas/api_handler/dist/
          retention-days: 7

  # ===========================================================================
  # Job 3: Build Frontend
  # ===========================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          REACT_APP_ENVIRONMENT: dev

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  # ===========================================================================
  # Job 4: Deploy Application to DEV
  # Deploys Lambda functions via Terraform and syncs frontend to S3
  # ===========================================================================
  deploy-dev:
    name: Deploy App to DEV
    runs-on: ubuntu-latest
    needs: [build-lambdas, build-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Download Lambda artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: lambdas/

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.6'

      - name: Terraform Init
        run: |
          cd infrastructure/environments/dev
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Apply (Lambda updates only)
        run: |
          cd infrastructure/environments/dev
          terraform apply -auto-approve \
            -var-file=terraform.tfvars \
            -target=module.lambda

      - name: Deploy frontend to S3 (DEV)
        run: |
          FRONTEND_BUCKET="qleam-dev-frontend"
          aws s3 sync frontend/build/ s3://${FRONTEND_BUCKET}/ --delete
          echo "✅ Frontend deployed to s3://${FRONTEND_BUCKET}"

      - name: Invalidate CloudFront cache (DEV)
        run: |
          CF_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='Qleam dev frontend'].Id" \
            --output text 2>/dev/null || echo "")
          if [ -n "$CF_ID" ] && [ "$CF_ID" != "None" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$CF_ID" \
              --paths "/*"
            echo "✅ CloudFront cache invalidated: $CF_ID"
          else
            echo "ℹ️  No CloudFront distribution found — skipping invalidation."
          fi

      - name: Deployment summary
        run: |
          echo "──────────────────────────────────────"
          echo "✅ DEV application deployed successfully"
          echo "   Branch : ${{ github.ref_name }}"
          echo "   Commit : ${{ github.sha }}"
          echo "──────────────────────────────────────"
