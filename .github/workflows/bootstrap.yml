name: Qleam — Bootstrap Remote State

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "bootstrap" to confirm one-time setup'
        required: true

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.6.6'

jobs:
  bootstrap:
    name: Bootstrap Terraform Remote State
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'bootstrap'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (Global)
        run: |
          cd qleam/infrastructure/global
          terraform init

      - name: Terraform Apply (Global Bootstrap)
        run: |
          cd qleam/infrastructure/global
          terraform apply -auto-approve

      - name: Output state bucket info
        run: |
          cd qleam/infrastructure/global
          echo "State bucket: $(terraform output -raw tf_state_bucket_name)"
          echo "Lock table: $(terraform output -raw tf_state_lock_table_name)"
          echo ""
          echo "Add these as GitHub Secrets:"
          echo "  TF_STATE_BUCKET = $(terraform output -raw tf_state_bucket_name)"
          echo "  TF_STATE_LOCK_TABLE = $(terraform output -raw tf_state_lock_table_name)"
