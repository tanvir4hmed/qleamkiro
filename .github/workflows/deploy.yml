name: Qleam — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  TF_VERSION: '1.6.6'

jobs:
  # ===========================================================================
  # Job 1: Test
  # ===========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov boto3 moto numpy

      - name: Run unit tests
        run: |
          cd qleam
          python -m pytest tests/ -v --cov=shared --cov=lambdas --cov-report=xml
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: qleam/coverage.xml

  # ===========================================================================
  # Job 2: Build Lambda Packages
  # ===========================================================================
  build-lambdas:
    name: Build Lambda Packages
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build shared utils layer
        run: |
          cd qleam
          mkdir -p lambdas/layers/shared_utils_pkg/python
          cp shared/*.py lambdas/layers/shared_utils_pkg/python/
          cd lambdas/layers/shared_utils_pkg
          zip -r ../shared_utils.zip python/
          cd ../../..
          echo "Shared utils layer built"

      - name: Build audio processing layer
        run: |
          cd qleam/lambdas/layers
          mkdir -p audio_processing_pkg/python
          pip install librosa numpy scipy --target audio_processing_pkg/python/ --platform manylinux2014_x86_64 --only-binary=:all: --python-version 3.11
          cd audio_processing_pkg
          zip -r ../audio_processing.zip python/
          cd ..
          echo "Audio processing layer built ($(du -sh audio_processing.zip | cut -f1))"

      - name: Build Lambda function packages
        run: |
          cd qleam
          for lambda_dir in lambdas/feature_extraction lambdas/cluster_engine lambdas/reinforcement_engine lambdas/insight_generator lambdas/feedback_processor lambdas/api_handler; do
            lambda_name=$(basename $lambda_dir)
            echo "Building $lambda_name..."
            mkdir -p $lambda_dir/dist
            cd $lambda_dir
            zip -r dist/${lambda_name}.zip handler.py
            cd ../..
          done
          echo "All Lambda packages built"

      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: |
            qleam/lambdas/layers/shared_utils.zip
            qleam/lambdas/layers/audio_processing.zip
            qleam/lambdas/feature_extraction/dist/
            qleam/lambdas/cluster_engine/dist/
            qleam/lambdas/reinforcement_engine/dist/
            qleam/lambdas/insight_generator/dist/
            qleam/lambdas/feedback_processor/dist/
            qleam/lambdas/api_handler/dist/
          retention-days: 7

  # ===========================================================================
  # Job 3: Build Frontend
  # ===========================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: qleam/frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd qleam/frontend
          npm ci

      - name: Build frontend
        run: |
          cd qleam/frontend
          npm run build
        env:
          REACT_APP_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: qleam/frontend/build/
          retention-days: 7

  # ===========================================================================
  # Job 4: Terraform Plan
  # ===========================================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [build-lambdas, build-frontend]
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Lambda artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: qleam/lambdas/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Init
        run: |
          cd qleam/infrastructure/environments/${{ steps.env.outputs.environment }}
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Validate
        run: |
          cd qleam/infrastructure/environments/${{ steps.env.outputs.environment }}
          terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          cd qleam/infrastructure/environments/${{ steps.env.outputs.environment }}
          terraform plan -out=tfplan -no-color 2>&1 | tee plan_output.txt
          echo "plan_exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Comment PR with plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('qleam/infrastructure/environments/${{ steps.env.outputs.environment }}/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... (truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan — ${{ steps.env.outputs.environment }}\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ steps.env.outputs.environment }}
          path: qleam/infrastructure/environments/${{ steps.env.outputs.environment }}/tfplan
          retention-days: 1

  # ===========================================================================
  # Job 5: Deploy to DEV (auto on push to develop/main)
  # ===========================================================================
  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Download Lambda artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: qleam/lambdas/

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: qleam/frontend/build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (DEV)
        run: |
          cd qleam/infrastructure/environments/dev
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Apply (DEV)
        run: |
          cd qleam/infrastructure/environments/dev
          terraform apply -auto-approve -var-file=terraform.tfvars

      - name: Get DEV outputs
        id: tf_outputs
        run: |
          cd qleam/infrastructure/environments/dev
          echo "frontend_bucket=$(terraform output -raw audio_bucket_name 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "cloudfront_id=$(terraform output -raw cloudwatch_dashboard 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: Deploy frontend to S3 (DEV)
        run: |
          FRONTEND_BUCKET="qleam-dev-frontend"
          aws s3 sync qleam/frontend/build/ s3://${FRONTEND_BUCKET}/ --delete
          echo "Frontend deployed to s3://${FRONTEND_BUCKET}"

      - name: Invalidate CloudFront cache (DEV)
        run: |
          CF_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='Qleam dev frontend'].Id" --output text 2>/dev/null || echo "")
          if [ -n "$CF_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $CF_ID --paths "/*"
            echo "CloudFront cache invalidated: $CF_ID"
          fi

  # ===========================================================================
  # Job 6: Deploy to PROD (manual approval required)
  # ===========================================================================
  deploy-prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.ref == 'refs/heads/main'
    environment: prod  # Requires manual approval in GitHub Environments settings
    steps:
      - uses: actions/checkout@v4

      - name: Download Lambda artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: qleam/lambdas/

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: qleam/frontend/build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (PROD)
        run: |
          cd qleam/infrastructure/environments/prod
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Apply (PROD)
        run: |
          cd qleam/infrastructure/environments/prod
          terraform apply -auto-approve -var-file=terraform.tfvars

      - name: Deploy frontend to S3 (PROD)
        run: |
          FRONTEND_BUCKET="qleam-prod-frontend"
          aws s3 sync qleam/frontend/build/ s3://${FRONTEND_BUCKET}/ --delete
          echo "Frontend deployed to s3://${FRONTEND_BUCKET}"

      - name: Invalidate CloudFront cache (PROD)
        run: |
          CF_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='Qleam prod frontend'].Id" --output text 2>/dev/null || echo "")
          if [ -n "$CF_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $CF_ID --paths "/*"
            echo "CloudFront cache invalidated: $CF_ID"
          fi

      - name: Notify deployment success
        if: success()
        run: echo "PROD deployment successful!"
