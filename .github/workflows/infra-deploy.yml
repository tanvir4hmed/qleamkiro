name: infra deploy

on:
  push:
    branches: [develop]
    paths:
      - 'infrastructure/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.6.6'
  TF_STATE_BUCKET: qleam-terraform-state
  TF_STATE_LOCK_TABLE: qleam-terraform-state-lock

jobs:

  # ============================================================
  # Job 1: Bootstrap — create S3 bucket & DynamoDB table if needed
  # ============================================================
  bootstrap:
    name: Bootstrap Remote State
    runs-on: ubuntu-latest
    outputs:
      bucket_name: ${{ steps.bootstrap.outputs.bucket_name }}
      lock_table_name: ${{ steps.bootstrap.outputs.lock_table_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure remote backend exists
        id: bootstrap
        run: |
          BUCKET="${{ env.TF_STATE_BUCKET }}"
          TABLE="${{ env.TF_STATE_LOCK_TABLE }}"

          # ── S3 bucket ──────────────────────────────────────────────────────
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "✅ S3 bucket '$BUCKET' already exists."
          else
            echo "🪣 Creating S3 bucket '$BUCKET'..."
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "${{ env.AWS_REGION }}"
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption \
              --bucket "$BUCKET" \
              --server-side-encryption-configuration \
                '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block \
              --bucket "$BUCKET" \
              --public-access-block-configuration \
                "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            echo "✅ S3 bucket '$BUCKET' created."
          fi

          # ── DynamoDB lock table ────────────────────────────────────────────
          if aws dynamodb describe-table --table-name "$TABLE" 2>/dev/null; then
            echo "✅ DynamoDB table '$TABLE' already exists."
          else
            echo "🔒 Creating DynamoDB table '$TABLE'..."
            aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${{ env.AWS_REGION }}"
            aws dynamodb wait table-exists --table-name "$TABLE"
            echo "✅ DynamoDB table '$TABLE' created."
          fi

          echo "bucket_name=$BUCKET"    >> $GITHUB_OUTPUT
          echo "lock_table_name=$TABLE" >> $GITHUB_OUTPUT

  # ============================================================
  # Job 2: Terraform Plan — show what will change
  # ============================================================
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: bootstrap

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Create placeholder zips so filebase64sha256() doesn't fail during plan.
      # Real Lambda code is deployed by the "app deploy" workflow.
      - name: Create placeholder Lambda zips
        run: |
          echo "placeholder" > /tmp/placeholder.py
          zip /tmp/placeholder.zip /tmp/placeholder.py

          mkdir -p lambdas/layers
          cp /tmp/placeholder.zip lambdas/layers/audio_processing.zip
          cp /tmp/placeholder.zip lambdas/layers/shared_utils.zip

          for fn in feature_extraction cluster_engine reinforcement_engine \
                    insight_generator feedback_processor api_handler; do
            mkdir -p lambdas/${fn}/dist
            cp /tmp/placeholder.zip lambdas/${fn}/dist/${fn}.zip
          done
          echo "✅ Placeholder zips created."

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          cd infrastructure/environments/dev
          terraform init \
            -backend-config="bucket=${{ needs.bootstrap.outputs.bucket_name }}" \
            -backend-config="dynamodb_table=${{ needs.bootstrap.outputs.lock_table_name }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        run: |
          cd infrastructure/environments/dev
          terraform validate

      - name: Terraform Plan
        run: |
          cd infrastructure/environments/dev
          terraform plan -var-file=terraform.tfvars -no-color 2>&1 | tee plan_output.txt
          echo ""
          echo "══════════════════════════════════════════════════════"
          echo "  Review the plan above, then approve the"
          echo "  'apply' job in GitHub Actions to deploy."
          echo "══════════════════════════════════════════════════════"

      - name: Upload plan output
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan-output
          path: infrastructure/environments/dev/plan_output.txt
          retention-days: 1

  # ============================================================
  # Job 3: Terraform Apply — requires manual approval via
  #         GitHub Environment "dev" protection rule
  # ============================================================
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [bootstrap, plan]
    environment: dev   # ← triggers manual approval gate

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Placeholders must exist again in this fresh runner for filebase64sha256()
      - name: Create placeholder Lambda zips
        run: |
          echo "placeholder" > /tmp/placeholder.py
          zip /tmp/placeholder.zip /tmp/placeholder.py

          mkdir -p lambdas/layers
          cp /tmp/placeholder.zip lambdas/layers/audio_processing.zip
          cp /tmp/placeholder.zip lambdas/layers/shared_utils.zip

          for fn in feature_extraction cluster_engine reinforcement_engine \
                    insight_generator feedback_processor api_handler; do
            mkdir -p lambdas/${fn}/dist
            cp /tmp/placeholder.zip lambdas/${fn}/dist/${fn}.zip
          done
          echo "✅ Placeholder zips created."

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          cd infrastructure/environments/dev
          terraform init \
            -backend-config="bucket=${{ needs.bootstrap.outputs.bucket_name }}" \
            -backend-config="dynamodb_table=${{ needs.bootstrap.outputs.lock_table_name }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Apply
        run: |
          cd infrastructure/environments/dev
          terraform apply -auto-approve -var-file=terraform.tfvars

      - name: Show outputs
        run: |
          cd infrastructure/environments/dev
          echo "──────────────────────────────────────"
          echo "✅ DEV infrastructure deployed"
          terraform output 2>/dev/null || true
          echo "──────────────────────────────────────"
