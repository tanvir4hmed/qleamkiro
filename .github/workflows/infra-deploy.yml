name: Infra Deploy (DEV)

on:
  push:
    branches: [develop]
    paths:
      - 'infrastructure/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.6.6'
  TF_STATE_BUCKET: qleam-terraform-state
  TF_STATE_LOCK_TABLE: qleam-terraform-state-lock

jobs:

  # ============================================================
  # Bootstrap Remote State
  # ============================================================
  bootstrap:
    runs-on: ubuntu-latest
    outputs:
      bucket_name: ${{ steps.bootstrap.outputs.bucket_name }}
      lock_table_name: ${{ steps.bootstrap.outputs.lock_table_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Remote Backend Exists
        id: bootstrap
        run: |
          BUCKET="${{ env.TF_STATE_BUCKET }}"
          TABLE="${{ env.TF_STATE_LOCK_TABLE }}"

          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket exists"
          else
            aws s3api create-bucket --bucket "$BUCKET" --region "${{ env.AWS_REGION }}"
          fi

          if aws dynamodb describe-table --table-name "$TABLE" 2>/dev/null; then
            echo "Lock table exists"
          else
            aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${{ env.AWS_REGION }}"
            aws dynamodb wait table-exists --table-name "$TABLE"
          fi

          echo "bucket_name=$BUCKET" >> $GITHUB_OUTPUT
          echo "lock_table_name=$TABLE" >> $GITHUB_OUTPUT

  # ============================================================
  # Terraform Plan
  # ============================================================
  terraform-plan:
    runs-on: ubuntu-latest
    needs: bootstrap

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          cd infrastructure/environments/dev
          terraform init \
            -backend-config="bucket=${{ needs.bootstrap.outputs.bucket_name }}" \
            -backend-config="dynamodb_table=${{ needs.bootstrap.outputs.lock_table_name }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Validate
        run: |
          cd infrastructure/environments/dev
          terraform validate

      - name: Terraform Plan
        run: |
          cd infrastructure/environments/dev
          terraform plan -var-file=terraform.tfvars -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: dev-tfplan
          path: infrastructure/environments/dev/tfplan

  # ============================================================
  # Terraform Apply (Manual Approval Required)
  # ============================================================
  terraform-apply:
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: dev   # 🔥 THIS TRIGGERS APPROVAL

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dev-tfplan
          path: infrastructure/environments/dev/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          cd infrastructure/environments/dev
          terraform init \
            -backend-config="bucket=${{ needs.bootstrap.outputs.bucket_name }}" \
            -backend-config="dynamodb_table=${{ needs.bootstrap.outputs.lock_table_name }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Apply
        run: |
          cd infrastructure/environments/dev
          terraform apply -auto-approve tfplan

      - name: Show Outputs
        run: |
          cd infrastructure/environments/dev
          terraform output || true