<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1300" viewBox="0 0 2100 1300">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #334155; }
      .zone-title { font: 700 20px Arial, sans-serif; fill: #0b132b; }
      .label { font: 700 14px Arial, sans-serif; fill: #0f172a; }
      .item { font: 500 13px Arial, sans-serif; fill: #334155; }
      .box { stroke: #334155; stroke-width: 2; rx: 12; ry: 12; }
      .zone { stroke: #94a3b8; stroke-width: 2; fill-opacity: 0.35; rx: 16; ry: 16; }
      .edge { fill: #dbeafe; }
      .api { fill: #e0f2fe; }
      .compute { fill: #e8f5e9; }
      .data { fill: #fff7d6; }
      .ml { fill: #fde2e4; }
      .ops { fill: #f3e8ff; }
      .infra { fill: #eef2ff; }
      .arrow { stroke: #1d3557; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .arrow-dashed { stroke: #1d3557; stroke-width: 2.2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1d3557"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2100" height="1300" class="bg"/>
  <text x="36" y="52" class="title">Qleam System Design - Grouped Services View</text>
  <text x="36" y="82" class="subtitle">No repeated service nodes. Similar services are listed inside grouped components.</text>

  <!-- Zones -->
  <rect x="24" y="112" width="560" height="360" class="zone" fill="#dbeafe"/>
  <text x="40" y="142" class="zone-title">A) Client and Entry</text>

  <rect x="614" y="112" width="760" height="360" class="zone" fill="#e0f2fe"/>
  <text x="630" y="142" class="zone-title">B) API and Runtime Orchestration</text>

  <rect x="1404" y="112" width="672" height="760" class="zone" fill="#fff7d6"/>
  <text x="1420" y="142" class="zone-title">C) Data and ML Plane</text>

  <rect x="24" y="502" width="1350" height="768" class="zone" fill="#f3e8ff"/>
  <text x="40" y="532" class="zone-title">D) MLOps and Platform Operations</text>

  <!-- A: Client -->
  <rect x="56" y="178" width="230" height="108" class="box edge"/>
  <text x="72" y="210" class="label">Parent Browser App</text>
  <text x="72" y="233" class="item">- React SPA (Amplify Auth)</text>
  <text x="72" y="252" class="item">- Records audio via MediaRecorder</text>
  <text x="72" y="271" class="item">- Calls REST API with JWT</text>

  <rect x="320" y="178" width="230" height="108" class="box edge"/>
  <text x="336" y="210" class="label">Edge Delivery (Grouped)</text>
  <text x="336" y="233" class="item">- CloudFront distribution</text>
  <text x="336" y="252" class="item">- Frontend S3 origin bucket</text>
  <text x="336" y="271" class="item">- SPA route fallback</text>

  <rect x="56" y="322" width="494" height="118" class="box edge"/>
  <text x="72" y="354" class="label">Identity Service</text>
  <text x="72" y="377" class="item">- Cognito User Pool and App Client</text>
  <text x="72" y="396" class="item">- Cognito Identity Pool role attachment</text>
  <text x="72" y="415" class="item">- API authorization via JWT claims</text>

  <!-- B: API and runtime -->
  <rect x="648" y="178" width="220" height="108" class="box api"/>
  <text x="664" y="210" class="label">API Gateway</text>
  <text x="664" y="233" class="item">- REST resources</text>
  <text x="664" y="252" class="item">- Cognito authorizer</text>
  <text x="664" y="271" class="item">- CORS + stage logging</text>

  <rect x="900" y="178" width="220" height="108" class="box compute"/>
  <text x="916" y="210" class="label">api_handler Lambda</text>
  <text x="916" y="233" class="item">- Child/session endpoints</text>
  <text x="916" y="252" class="item">- Presigned upload URLs</text>
  <text x="916" y="271" class="item">- Starts processing workflow</text>

  <rect x="1152" y="178" width="190" height="108" class="box compute"/>
  <text x="1168" y="210" class="label">Processing SFN</text>
  <text x="1168" y="233" class="item">- AudioClassifier</text>
  <text x="1168" y="252" class="item">- Fast reject choice</text>
  <text x="1168" y="271" class="item">- InsightGenerator</text>

  <rect x="648" y="322" width="694" height="118" class="box compute"/>
  <text x="664" y="354" class="label">Runtime Worker Group (Similar Services Listed)</text>
  <text x="664" y="377" class="item">- feature_extraction: quality gate, diarization, sound classification, age and emotion inference</text>
  <text x="664" y="396" class="item">- insight_generator: route by sound type, compose insight payload, persist insight</text>
  <text x="664" y="415" class="item">- feedback_processor: confirm/correct labels, anonymize training data eligibility</text>

  <!-- C: Data and ML -->
  <rect x="1438" y="178" width="606" height="178" class="box data"/>
  <text x="1454" y="210" class="label">DynamoDB Group (Similar Tables Listed)</text>
  <text x="1454" y="233" class="item">- ChildProfile (parent_id-index)</text>
  <text x="1454" y="252" class="item">- Session (child_id-timestamp-index)</text>
  <text x="1454" y="271" class="item">- Feedback (session_id-created_at-index)</text>
  <text x="1454" y="290" class="item">- TrainingFeatures (sound_type-age_days-index)</text>
  <text x="1454" y="309" class="item">- ModelVersions (active model metadata)</text>
  <text x="1454" y="328" class="item">- All encrypted with PITR enabled in env configs</text>

  <rect x="1438" y="392" width="606" height="118" class="box data"/>
  <text x="1454" y="424" class="label">S3 Storage Group (Similar Buckets Listed)</text>
  <text x="1454" y="447" class="item">- Audio bucket (uploads, lifecycle, EventBridge enabled)</text>
  <text x="1454" y="466" class="item">- Frontend bucket (static app origin)</text>
  <text x="1454" y="485" class="item">- Models bucket (HuBERT/model artifacts)</text>

  <rect x="1438" y="546" width="606" height="128" class="box ml"/>
  <text x="1454" y="578" class="label">Managed ML and Speech Services</text>
  <text x="1454" y="601" class="item">- SageMaker Serverless endpoint for HuBERT embeddings</text>
  <text x="1454" y="620" class="item">- Optional Amazon Transcribe path for speech sessions</text>
  <text x="1454" y="639" class="item">- Runtime classifier loaded from active model version</text>

  <rect x="1438" y="710" width="606" height="128" class="box infra"/>
  <text x="1454" y="742" class="label">Security and Network Controls (Grouped)</text>
  <text x="1454" y="765" class="item">- Private Lambda subnets in VPC, NAT, SGs</text>
  <text x="1454" y="784" class="item">- IAM least-privilege policies for lambda/sfn/apigw</text>
  <text x="1454" y="803" class="item">- Encryption in transit and at rest across core stores</text>

  <!-- D: MLOps and operations -->
  <rect x="56" y="568" width="390" height="142" class="box ops"/>
  <text x="72" y="600" class="label">Continuous Training Trigger Group</text>
  <text x="72" y="623" class="item">- EventBridge daily schedule</text>
  <text x="72" y="642" class="item">- training_check Lambda thresholds</text>
  <text x="72" y="661" class="item">- batch and weekly retrain rules</text>
  <text x="72" y="680" class="item">- starts training state machine</text>

  <rect x="480" y="568" width="500" height="142" class="box compute"/>
  <text x="496" y="600" class="label">Training Pipeline Group</text>
  <text x="496" y="623" class="item">- Step Functions: load - train - validate - promote</text>
  <text x="496" y="642" class="item">- model_trainer Lambda executes each step</text>
  <text x="496" y="661" class="item">- promotion writes ModelVersions and marks trained samples</text>
  <text x="496" y="680" class="item">- supports skip/no-improvement outcomes</text>

  <rect x="1014" y="568" width="328" height="142" class="box ops"/>
  <text x="1030" y="600" class="label">Observability Group</text>
  <text x="1030" y="623" class="item">- CloudWatch logs/metrics/dashboard</text>
  <text x="1030" y="642" class="item">- alarms for Lambda/API/SFN</text>
  <text x="1030" y="661" class="item">- SNS notification topic</text>

  <rect x="56" y="748" width="620" height="158" class="box ops"/>
  <text x="72" y="780" class="label">CI/CD Workflows Group (GitHub Actions)</text>
  <text x="72" y="803" class="item">- 1-infra-deploy: terraform plan/apply with phased bootstrapping</text>
  <text x="72" y="822" class="item">- 2-lambda-deploy: tests, container build, push to ECR, update Lambda image URIs</text>
  <text x="72" y="841" class="item">- 3-frontend-deploy: build React app, sync to S3, invalidate CloudFront</text>
  <text x="72" y="860" class="item">- 4-infra-destroy: staged teardown and force cleanup paths</text>
  <text x="72" y="879" class="item">- branch strategy targets develop for deploy pipelines</text>

  <rect x="710" y="748" width="632" height="158" class="box ops"/>
  <text x="726" y="780" class="label">Image and Build Artifact Group</text>
  <text x="726" y="803" class="item">- ECR repositories for lambda images: feature_extraction, insight_generator,</text>
  <text x="726" y="822" class="item">  feedback_processor, api_handler, training_check, model_trainer</text>
  <text x="726" y="841" class="item">- Dockerfiles per Lambda role under docker/</text>
  <text x="726" y="860" class="item">- image tag strategy: commit SHA + latest</text>

  <rect x="56" y="944" width="1286" height="292" class="box infra"/>
  <text x="72" y="976" class="label">Infrastructure as Code Group (Terraform Modules)</text>
  <text x="72" y="999" class="item">- Environment roots: dev and prod. Global bootstrap: state bucket and lock table.</text>
  <text x="72" y="1018" class="item">- Module set: vpc, iam, ecr, s3, dynamodb, cognito, lambda, step_functions, api_gateway, cloudwatch, frontend, sagemaker.</text>
  <text x="72" y="1037" class="item">- Deployment topology: frontend at CloudFront/S3, API via API Gateway/Lambda, data in DynamoDB/S3, async workflows in Step Functions.</text>
  <text x="72" y="1056" class="item">- Runtime controls: CORS origin lists, feature flags (SageMaker/Bedrock/Transcribe), log levels, training table wiring.</text>
  <text x="72" y="1075" class="item">- Network model: Lambda in private subnets, NAT egress, S3 and DynamoDB VPC endpoints.</text>
  <text x="72" y="1094" class="item">- Security model: IAM least privilege, encrypted storage, Cognito-protected API methods.</text>
  <text x="72" y="1113" class="item">- Monitoring model: alarms + dashboard for key service error/duration/failure signals.</text>

  <!-- Main flow arrows -->
  <path d="M286 232 L320 232" class="arrow"/>
  <path d="M550 232 L648 232" class="arrow"/>
  <path d="M868 232 L900 232" class="arrow"/>
  <path d="M1120 232 L1152 232" class="arrow"/>
  <path d="M1247 286 L1247 322" class="arrow"/>

  <!-- Auth and upload/control -->
  <path d="M210 286 L210 322" class="arrow"/>
  <path d="M160 286 L160 392" class="arrow-dashed"/>
  <path d="M171 286 L171 392" class="arrow-dashed"/>
  <path d="M171 286 L171 392" class="arrow-dashed"/>
  <path d="M170 286 L170 392" class="arrow-dashed"/>
  <path d="M260 286 L1500 392" class="arrow-dashed"/>
  <path d="M980 286 L1500 392" class="arrow"/>

  <!-- Runtime to data -->
  <path d="M1000 440 L1510 260" class="arrow"/>
  <path d="M1060 440 L1510 440" class="arrow"/>
  <path d="M1110 440 L1510 610" class="arrow"/>
  <path d="M1160 440 L1510 260" class="arrow-dashed"/>
  <path d="M1205 440 L1510 440" class="arrow-dashed"/>

  <!-- Feedback flow -->
  <path d="M980 250 L980 322" class="arrow-dashed"/>
  <path d="M1030 322 L1030 440" class="arrow-dashed"/>
  <path d="M1150 322 L1510 260" class="arrow"/>

  <!-- Training loop -->
  <path d="M446 639 L480 639" class="arrow"/>
  <path d="M980 639 L1014 639" class="arrow"/>
  <path d="M730 710 L730 748" class="arrow"/>
  <path d="M860 710 L860 748" class="arrow"/>
  <path d="M580 710 L580 944" class="arrow"/>
  <path d="M920 710 L920 944" class="arrow"/>
  <path d="M620 640 L1510 260" class="arrow"/>
  <path d="M700 640 L1510 440" class="arrow"/>

  <!-- CI to runtime/data/infra -->
  <path d="M676 826 L710 826" class="arrow"/>
  <path d="M1040 826 L1438 610" class="arrow-dashed"/>
  <path d="M1230 826 L1438 440" class="arrow-dashed"/>
  <path d="M1100 826 L900 232" class="arrow-dashed"/>
  <path d="M1240 826 L648 232" class="arrow-dashed"/>
  <path d="M360 906 L360 944" class="arrow"/>
  <path d="M1100 906 L1100 944" class="arrow"/>

  <!-- Legend -->
  <rect x="1440" y="916" width="604" height="320" class="box infra"/>
  <text x="1456" y="948" class="label">Legend</text>

  <rect x="1458" y="970" width="16" height="16" class="box edge"/>
  <text x="1484" y="983" class="item">Client and edge delivery</text>
  <rect x="1458" y="998" width="16" height="16" class="box api"/>
  <text x="1484" y="1011" class="item">API entrypoint</text>
  <rect x="1458" y="1026" width="16" height="16" class="box compute"/>
  <text x="1484" y="1039" class="item">Compute and workflow services</text>
  <rect x="1458" y="1054" width="16" height="16" class="box data"/>
  <text x="1484" y="1067" class="item">Data storage services</text>
  <rect x="1458" y="1082" width="16" height="16" class="box ml"/>
  <text x="1484" y="1095" class="item">ML and speech managed services</text>
  <rect x="1458" y="1110" width="16" height="16" class="box ops"/>
  <text x="1484" y="1123" class="item">Operations and CI/CD</text>
  <rect x="1458" y="1138" width="16" height="16" class="box infra"/>
  <text x="1484" y="1151" class="item">Infrastructure and platform controls</text>
  <path d="M1458 1172 L1518 1172" class="arrow"/>
  <text x="1528" y="1177" class="item">Primary runtime flow</text>
  <path d="M1458 1200 L1518 1200" class="arrow-dashed"/>
  <text x="1528" y="1205" class="item">Async, optional, or control flow</text>
</svg>
