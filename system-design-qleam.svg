<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1400" viewBox="0 0 2200 1400">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #1b263b; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #415a77; }
      .section { font: 700 20px Arial, sans-serif; fill: #0b132b; }
      .label { font: 600 14px Arial, sans-serif; fill: #0b132b; }
      .small { font: 500 12px Arial, sans-serif; fill: #33415c; }
      .box { stroke: #33415c; stroke-width: 2; rx: 12; ry: 12; }
      .group { fill-opacity: 0.35; stroke: #8da9c4; stroke-width: 2; rx: 14; ry: 14; }
      .arrow { stroke: #1d3557; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .arrow-dashed { stroke: #1d3557; stroke-width: 2.2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .edge { fill: #dbeafe; }
      .api { fill: #e0f2fe; }
      .compute { fill: #e8f5e9; }
      .data { fill: #fff3cd; }
      .ml { fill: #fde2e4; }
      .ops { fill: #f3e8ff; }
      .infra { fill: #eef2ff; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1d3557"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2200" height="1400" fill="#f8fafc"/>
  <text x="40" y="52" class="title">Qleam System Design (Derived from Current Codebase)</text>
  <text x="40" y="82" class="subtitle">Frontend + Serverless API + Audio Analysis Pipeline + Continuous Retraining Loop</text>

  <!-- Section backgrounds -->
  <rect x="30" y="110" width="730" height="360" class="group" fill="#dbeafe"/>
  <text x="45" y="140" class="section">1) Client and Access Layer</text>

  <rect x="790" y="110" width="1360" height="620" class="group" fill="#e0f2fe"/>
  <text x="805" y="140" class="section">2) Runtime Pipeline and Application Services</text>

  <rect x="30" y="500" width="2120" height="360" class="group" fill="#fff3cd"/>
  <text x="45" y="530" class="section">3) Data Plane and Managed Services</text>

  <rect x="30" y="890" width="2120" height="470" class="group" fill="#f3e8ff"/>
  <text x="45" y="920" class="section">4) MLOps, CI/CD, and Platform Operations</text>

  <!-- Client + edge -->
  <rect x="60" y="180" width="210" height="90" class="box edge"/>
  <text x="78" y="215" class="label">Parent Browser</text>
  <text x="78" y="238" class="small">React SPA usage</text>
  <text x="78" y="256" class="small">MediaRecorder audio/webm</text>

  <rect x="330" y="180" width="230" height="90" class="box edge"/>
  <text x="348" y="215" class="label">CloudFront CDN</text>
  <text x="348" y="238" class="small">Serves SPA assets</text>
  <text x="348" y="256" class="small">from Frontend S3 bucket</text>

  <rect x="60" y="310" width="230" height="110" class="box edge"/>
  <text x="78" y="345" class="label">Amazon Cognito</text>
  <text x="78" y="368" class="small">User Pool + App Client</text>
  <text x="78" y="386" class="small">JWT auth for API routes</text>
  <text x="78" y="404" class="small">Identity Pool attached</text>

  <!-- API and processing -->
  <rect x="840" y="180" width="250" height="95" class="box api"/>
  <text x="860" y="215" class="label">API Gateway (REST)</text>
  <text x="860" y="238" class="small">Cognito authorizer</text>
  <text x="860" y="256" class="small">/child /session /status routes</text>

  <rect x="1130" y="180" width="260" height="95" class="box compute"/>
  <text x="1150" y="215" class="label">Lambda: api_handler</text>
  <text x="1150" y="238" class="small">CRUD + presigned upload</text>
  <text x="1150" y="256" class="small">Starts Step Functions</text>

  <rect x="1440" y="180" width="300" height="95" class="box compute"/>
  <text x="1460" y="215" class="label">Step Functions: Processing</text>
  <text x="1460" y="238" class="small">AudioClassifier -&gt; InsightGenerator</text>
  <text x="1460" y="256" class="small">Fast-reject path supported</text>

  <rect x="1770" y="180" width="330" height="95" class="box compute"/>
  <text x="1790" y="215" class="label">Lambda: feature_extraction</text>
  <text x="1790" y="238" class="small">quality gate, diarization, sound type</text>
  <text x="1790" y="256" class="small">HuBERT + classifier + routing</text>

  <rect x="1770" y="310" width="330" height="95" class="box compute"/>
  <text x="1790" y="345" class="label">Lambda: insight_generator</text>
  <text x="1790" y="368" class="small">cry/speech/laugh/noise decisions</text>
  <text x="1790" y="386" class="small">writes parent-facing insight JSON</text>

  <rect x="1440" y="310" width="300" height="95" class="box compute"/>
  <text x="1460" y="345" class="label">Lambda: feedback_processor</text>
  <text x="1460" y="368" class="small">confirm/correct emotion labels</text>
  <text x="1460" y="386" class="small">anonymize training samples</text>

  <!-- VPC boundary -->
  <rect x="1105" y="155" width="1020" height="280" fill="none" stroke="#5c6b7a" stroke-dasharray="10 6" stroke-width="2"/>
  <text x="1118" y="172" class="small">Private VPC subnets for Lambda compute (NAT + VPC endpoints)</text>

  <!-- Data + managed services -->
  <rect x="70" y="570" width="280" height="95" class="box data"/>
  <text x="90" y="605" class="label">S3: Audio Storage</text>
  <text x="90" y="628" class="small">raw audio + training embeddings</text>
  <text x="90" y="646" class="small">presigned PUT from browser</text>

  <rect x="390" y="570" width="220" height="95" class="box data"/>
  <text x="410" y="605" class="label">DynamoDB</text>
  <text x="410" y="628" class="small">ChildProfile</text>
  <text x="410" y="646" class="small">parent_id-index</text>

  <rect x="650" y="570" width="240" height="95" class="box data"/>
  <text x="670" y="605" class="label">DynamoDB</text>
  <text x="670" y="628" class="small">Session</text>
  <text x="670" y="646" class="small">child_id-timestamp-index</text>

  <rect x="930" y="570" width="220" height="95" class="box data"/>
  <text x="950" y="605" class="label">DynamoDB</text>
  <text x="950" y="628" class="small">Feedback</text>
  <text x="950" y="646" class="small">session_id-created_at-index</text>

  <rect x="1190" y="570" width="260" height="95" class="box data"/>
  <text x="1210" y="605" class="label">DynamoDB</text>
  <text x="1210" y="628" class="small">TrainingFeatures</text>
  <text x="1210" y="646" class="small">feature metadata + labels</text>

  <rect x="1490" y="570" width="250" height="95" class="box data"/>
  <text x="1510" y="605" class="label">DynamoDB</text>
  <text x="1510" y="628" class="small">ModelVersions</text>
  <text x="1510" y="646" class="small">active model tracking</text>

  <rect x="1780" y="570" width="320" height="95" class="box ml"/>
  <text x="1800" y="605" class="label">SageMaker Endpoint (HuBERT)</text>
  <text x="1800" y="628" class="small">feature_extraction invokes endpoint</text>
  <text x="1800" y="646" class="small">returns 768-dim embeddings</text>

  <rect x="70" y="700" width="280" height="95" class="box ml"/>
  <text x="90" y="735" class="label">AWS Transcribe (optional)</text>
  <text x="90" y="758" class="small">Used by insight_generator for speech</text>
  <text x="90" y="776" class="small">word-level confidence output</text>

  <rect x="390" y="700" width="280" height="95" class="box data"/>
  <text x="410" y="735" class="label">S3: Model Artifacts</text>
  <text x="410" y="758" class="small">emotion classifier versions</text>
  <text x="410" y="776" class="small">loaded for runtime inference</text>

  <rect x="710" y="700" width="340" height="95" class="box infra"/>
  <text x="730" y="735" class="label">CloudWatch + SNS</text>
  <text x="730" y="758" class="small">Logs, alarms, dashboard, notifications</text>
  <text x="730" y="776" class="small">API/Lambda/StepFunctions monitoring</text>

  <!-- MLOps + CI -->
  <rect x="70" y="970" width="360" height="105" class="box ops"/>
  <text x="90" y="1008" class="label">EventBridge (daily schedule)</text>
  <text x="90" y="1031" class="small">Triggers training pipeline checks</text>
  <text x="90" y="1049" class="small">Retraining decision cadence</text>

  <rect x="470" y="970" width="360" height="105" class="box compute"/>
  <text x="490" y="1008" class="label">Step Functions: Training</text>
  <text x="490" y="1031" class="small">TrainingCheck -&gt; load/train/validate/promote</text>
  <text x="490" y="1049" class="small">Skip or promote based on thresholds</text>

  <rect x="870" y="970" width="300" height="105" class="box compute"/>
  <text x="890" y="1008" class="label">Lambda: training_check</text>
  <text x="890" y="1031" class="small">Counts confirmed samples</text>
  <text x="890" y="1049" class="small">batch + weekly trigger rules</text>

  <rect x="1210" y="970" width="320" height="105" class="box compute"/>
  <text x="1230" y="1008" class="label">Lambda: model_trainer</text>
  <text x="1230" y="1031" class="small">two-branch age-conditioned model</text>
  <text x="1230" y="1049" class="small">load/train/validate/promote steps</text>

  <rect x="1570" y="970" width="260" height="105" class="box ops"/>
  <text x="1590" y="1008" class="label">GitHub Actions CI/CD</text>
  <text x="1590" y="1031" class="small">1 infra deploy</text>
  <text x="1590" y="1049" class="small">2 lambda deploy, 3 frontend deploy</text>

  <rect x="1870" y="970" width="250" height="105" class="box ops"/>
  <text x="1890" y="1008" class="label">ECR Repositories</text>
  <text x="1890" y="1031" class="small">Lambda container images</text>
  <text x="1890" y="1049" class="small">feature/api/insight/etc.</text>

  <rect x="1570" y="1120" width="550" height="170" class="box infra"/>
  <text x="1590" y="1160" class="label">Terraform Modules (dev/prod)</text>
  <text x="1590" y="1183" class="small">vpc, iam, ecr, s3, dynamodb, cognito, lambda,</text>
  <text x="1590" y="1201" class="small">step_functions, api_gateway, cloudwatch, frontend, sagemaker</text>
  <text x="1590" y="1224" class="small">state backend: S3 + DynamoDB lock</text>
  <text x="1590" y="1247" class="small">manual destroy workflow exists for full teardown</text>

  <!-- Primary flow arrows -->
  <path d="M270 225 L330 225" class="arrow"/>
  <path d="M175 270 L175 310" class="arrow"/>
  <path d="M560 225 L840 225" class="arrow"/>
  <path d="M1088 225 L1130 225" class="arrow"/>
  <path d="M1390 225 L1440 225" class="arrow"/>
  <path d="M1740 225 L1770 225" class="arrow"/>
  <path d="M1935 275 L1935 310" class="arrow"/>

  <!-- Client direct upload + process start -->
  <path d="M175 270 L175 570" class="arrow-dashed"/>
  <text x="185" y="430" class="small">presigned PUT upload</text>
  <path d="M270 205 L1130 205" class="arrow-dashed"/>
  <text x="640" y="192" class="small">API call: create upload session / start processing</text>

  <!-- API to data -->
  <path d="M1240 275 L500 570" class="arrow"/>
  <path d="M1260 275 L760 570" class="arrow"/>
  <path d="M1280 275 L1030 570" class="arrow"/>
  <path d="M1310 275 L1320 570" class="arrow"/>

  <!-- Processing to data/services -->
  <path d="M1880 275 L2200 500" class="arrow" transform="translate(-100,0)"/>
  <path d="M1830 275 L210 570" class="arrow"/>
  <path d="M1870 275 L760 570" class="arrow"/>
  <path d="M1950 275 L1880 570" class="arrow"/>
  <path d="M1830 340 L210 700" class="arrow-dashed"/>
  <path d="M1910 405 L760 570" class="arrow"/>

  <!-- Feedback loop -->
  <path d="M1130 240 L1490 310" class="arrow-dashed"/>
  <text x="1250" y="300" class="small">invoke feedback processor</text>
  <path d="M1590 405 L1030 570" class="arrow"/>
  <path d="M1610 405 L1320 570" class="arrow"/>

  <!-- Training loop -->
  <path d="M250 1022 L470 1022" class="arrow"/>
  <path d="M830 1022 L870 1022" class="arrow"/>
  <path d="M1010 1022 L1210 1022" class="arrow"/>
  <path d="M1370 1075 L1320 570" class="arrow"/>
  <path d="M1390 1075 L510 700" class="arrow"/>
  <path d="M1450 1075 L1610 570" class="arrow"/>
  <path d="M1470 1075 L540 700" class="arrow"/>

  <!-- Runtime model dependency -->
  <path d="M1600 665 L1830 275" class="arrow-dashed"/>
  <text x="1610" y="700" class="small">active model read</text>

  <!-- CI/CD + infra -->
  <path d="M1830 1022 L1870 1022" class="arrow"/>
  <path d="M1750 1075 L1750 1120" class="arrow"/>
  <path d="M2000 1075 L2000 1120" class="arrow"/>
  <path d="M1980 1120 L1880 405" class="arrow-dashed"/>
  <path d="M1900 1120 L1930 405" class="arrow-dashed"/>
  <path d="M1820 1120 L1250 275" class="arrow-dashed"/>
  <path d="M1780 1120 L940 275" class="arrow-dashed"/>

  <!-- Legend -->
  <rect x="60" y="1310" width="18" height="18" class="box edge"/>
  <text x="88" y="1324" class="small">Client/Edge</text>
  <rect x="220" y="1310" width="18" height="18" class="box api"/>
  <text x="248" y="1324" class="small">API</text>
  <rect x="310" y="1310" width="18" height="18" class="box compute"/>
  <text x="338" y="1324" class="small">Compute</text>
  <rect x="430" y="1310" width="18" height="18" class="box data"/>
  <text x="458" y="1324" class="small">Data Store</text>
  <rect x="570" y="1310" width="18" height="18" class="box ml"/>
  <text x="598" y="1324" class="small">ML Service</text>
  <rect x="710" y="1310" width="18" height="18" class="box ops"/>
  <text x="738" y="1324" class="small">Ops/CI</text>
  <line x1="860" y1="1319" x2="920" y2="1319" class="arrow"/>
  <text x="930" y="1324" class="small">Primary sync flow</text>
  <line x1="1110" y1="1319" x2="1170" y2="1319" class="arrow-dashed"/>
  <text x="1180" y="1324" class="small">Async/optional/control flow</text>
</svg>
